[package]
edition = "2021"
rust-version = "1.70"
name = "ort"
version = "2.0.0-rc.4"
authors = [
    "pyke.io <contact@pyke.io>",
    "Nicolas Bigaouette <nbigaouette@gmail.com>",
]
build = false
include = [
    "src/",
    "benches/",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "README.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A safe Rust wrapper for ONNX Runtime 1.18 - Optimize and accelerate machine learning inference & training"
documentation = "https://ort.pyke.io/"
readme = "README.md"
keywords = [
    "machine-learning",
    "ai",
    "ml",
]
categories = [
    "algorithms",
    "mathematics",
    "science",
    "science",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/pykeio/ort"

[package.metadata.docs.rs]
features = [
    "ndarray",
    "half",
    "training",
    "operator-libraries",
    "fetch-models",
    "load-dynamic",
    "copy-dylibs",
]
rustdoc-args = [
    "--cfg",
    "docsrs",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]

[features]
acl = ["ort-sys/acl"]
armnn = ["ort-sys/armnn"]
cann = ["ort-sys/cann"]
copy-dylibs = ["ort-sys/copy-dylibs"]
coreml = ["ort-sys/coreml"]
cuda = ["ort-sys/cuda"]
default = [
    "ndarray",
    "half",
    "download-binaries",
    "copy-dylibs",
]
directml = ["ort-sys/directml"]
download-binaries = ["ort-sys/download-binaries"]
fetch-models = ["ureq"]
load-dynamic = [
    "libloading",
    "ort-sys/load-dynamic",
]
migraphx = ["ort-sys/migraphx"]
nnapi = ["ort-sys/nnapi"]
onednn = ["ort-sys/onednn"]
openvino = ["ort-sys/openvino"]
operator-libraries = [
    "libc",
    "winapi",
]
qnn = ["ort-sys/qnn"]
rknpu = ["ort-sys/rknpu"]
rocm = ["ort-sys/rocm"]
tensorrt = ["ort-sys/tensorrt"]
training = ["ort-sys/training"]
tvm = ["ort-sys/tvm"]
vitis = ["ort-sys/vitis"]
xnnpack = ["ort-sys/xnnpack"]

[lib]
name = "ort"
path = "src/lib.rs"

[[bench]]
name = "squeezenet"
path = "benches/squeezenet.rs"
harness = false

[dependencies]
thiserror = "1.0"
tracing = "0.1"

[dependencies.half]
version = "2.1"
optional = true

[dependencies.libloading]
version = "0.8"
optional = true

[dependencies.ndarray]
version = "0.15"
optional = true

[dependencies.ort-sys]
version = "2.0.0-rc.4"
path = "ort-sys-2.0.0-rc.4"

[dependencies.ureq]
version = "2.1"
features = ["tls"]
optional = true
default-features = false

[dev-dependencies]
anyhow = "1.0"
glassbench = "0.4"
image = "0.25"
tokio-test = "0.4.3"
ureq = "2.1"
wasm-bindgen-test = "0.3"

[dev-dependencies.test-log]
version = "0.2"
features = ["trace"]
default-features = false

[dev-dependencies.tokio]
version = "1.36"
features = ["test-util"]

[dev-dependencies.tracing-subscriber]
version = "0.3"
features = [
    "env-filter",
    "fmt",
]
default-features = false

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"
web-sys = "0.3"

[target."cfg(unix)".dependencies.libc]
version = "0.2"
optional = true

[target."cfg(windows)".dependencies.winapi]
version = "0.3"
features = [
    "std",
    "libloaderapi",
]
optional = true

[workspace]
members = [
    "ort-sys",
    "examples/async-gpt2-api",
    "examples/custom-ops",
    "examples/gpt2",
    "examples/model-info",
    "examples/yolov8",
    "examples/modnet",
    "examples/training",
    "examples/webassembly",
]
exclude = ["examples/cudarc"]
default-members = [
    ".",
    "examples/async-gpt2-api",
    "examples/custom-ops",
    "examples/gpt2",
    "examples/model-info",
    "examples/yolov8",
    "examples/modnet",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
